<section
    id="page-supplier-detail"
    class="page active"
>

    <!-- ==============================
         页面头部（公共组件，由 mountPageHeader 渲染）
         ============================== -->
    <div id="pageHeader"
         data-title="货佬款项详情"
         data-subtitle-id="supplierDetailSubtitle"
         data-show-back="true">
    </div>


    <!-- ==============================
         总览
         ============================== -->
    <section class="card supplier-summary">

        <div class="summary-title">
            货佬款项合计
        </div>

        <div
            id="supplierDetailTotal"
            class="summary-total"
        >
            ¥0.00
        </div>

        <div
            id="supplierDetailDifference"
            class="summary-difference"
        >
        </div>

    </section>


    <!-- ==============================
         食材货款
         ============================== -->
    <section class="card supplier-section">

        <div class="card-title">

            <div>

                <h2>食材货款</h2>

                <p>
                    食材供应商
                </p>

            </div>

            <strong
                id="foodSupplierTotal"
            >
                ¥0.00
            </strong>

        </div>


        <div
            id="foodSupplierList"
            class="supplier-list"
        >
        </div>

    </section>


    <!-- ==============================
         非食材货款
         ============================== -->
    <section class="card supplier-section">

        <div class="card-title">

            <div>

                <h2>非食材货款</h2>

                <p>
                    非食材供应商
                </p>

            </div>

            <strong
                id="nonFoodSupplierTotal"
            >
                ¥0.00
            </strong>

        </div>


        <div
            id="nonFoodSupplierList"
            class="supplier-list"
        >
        </div>

    </section>

</section>
